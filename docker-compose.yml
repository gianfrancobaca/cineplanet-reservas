services:
  reservas:
    build: ./servicios/reservas
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:18.6-trixie
    env_file: .env
    volumes: 
    - datos_postgresql:/var/lib/postgresql/
    - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 3s
      timeout: 2s
      retries: 5

volumes:
  datos_postgresql:

